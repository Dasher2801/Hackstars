<html>
<style> @import url('style.css'); </style>
    <head>
        <title>Hackstars</title>
    </head>
    <body>
    <div class="overlay">
        <div class="title">Particle Shockwave</div>
        <div class="subtitle">Interactive Particle Field with Physical Wave</div>
    </div>

    <div class="hint" id="hint">Click anywhere to start a wave</div>

    <div class="controls">
        <div class="control-group">
            <label for="forceSlider">Wave Force:</label>
            <input type="range" id="forceSlider" min="20" max="120" value="60">
        </div>
        <div class="control-group">
            <label for="speedSlider">Speed:</label>
            <input type="range" id="speedSlider" min="3" max="15" value="7">
        </div>
        <button class="toggle-btn active" id="audioToggle">Audio: AN</button>
        <button class="toggle-btn" id="clearBtn">Reset Stars</button>
    </div>
    <canvas id="canvas"></canvas>
    </body>
    <script src="script.js"></script>
</html>
